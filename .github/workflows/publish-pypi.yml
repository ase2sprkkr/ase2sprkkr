# Configure the PyPI Trusted Publisher with:
#   Owner: ase2sprkkr
#   Repository: ase2sprkkr
#   Workflow: publish-pypi.yml
#   Environment: pypi
# Protect the GitHub 'pypi' environment with required reviewers and v* tag rules.
# Pushing a matching version tag from develop triggers upload.
name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check tag, version and develop ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/develop:refs/remotes/origin/develop
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/develop; then
            echo 'The release tag must point to a commit on develop.' >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          expected = f'v{version}'
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Release tag must be {expected}, not {os.environ["RELEASE_TAG"]}')
          PY

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      # Equivalent to the package prerequisite of `make pip` (sdist only).
      - name: Build source distribution
        run: python -m build --sdist

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v6
        with:
          name: python-source-distribution
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ase2sprkkr/
    permissions:
      id-token: write
    steps:
      - name: Download validated distribution
        uses: actions/download-artifact@v7
        with:
          name: python-source-distribution
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
