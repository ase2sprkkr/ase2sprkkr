name: tests
permissions:
  contents: read

on:
  push:
    branches-ignore:
      - 'chatgpt-**'
  pull_request:
    branches:
      - workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - run: |
         mkdir -p ~/.config/matplotlib
         echo "text.usetex : False" >> ~/.config/matplotlib/matplotlibrc
    - run: ./install_dependencies.sh
    - name: Test installed wheel
      # Profile slow cases without an extra test run or separate CI job.
      run: DO_NOT_RUN_SPRKKR=1 "$GITHUB_WORKSPACE/run_tests" --durations=20

  execution-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: |
         mkdir -p ~/.config/matplotlib
         echo "text.usetex : False" >> ~/.config/matplotlib/matplotlibrc
    - run: ./install_dependencies.sh
    - name: Test SSH and PSI/J Slurm execution
      env:
        ASE2SPRKKR_RUN_DOCKER_TESTS: '1'
      run: >-
        "$GITHUB_WORKSPACE/run_tests"
        -k
        "remote_executor_over_ssh or remote_executor_runs_psij_slurm_over_ssh"

  guy4ase-compatibility:
    if: github.event_name == 'push' && github.ref == 'refs/heads/workflow'
    needs: [build, execution-integration]
    uses: ase2sprkkr/guy4kkr/.github/workflows/backend-compatibility.yml@master
    with:
      ase2sprkkr_ref: ${{ github.sha }}

  # h5py is optional; do not allow an import skip to hide failed exports.
  arpes-nexus:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: |
        mkdir -p ~/.config/matplotlib
        echo "text.usetex : False" >> ~/.config/matplotlib/matplotlibrc
    - run: ./install_dependencies.sh
    - name: Install NeXus writers and independent reader
      run: |
        python -m pip install "h5py>=3.8" "nexusformat>=2.0"
        python -c "import h5py, nexusformat.nexus"
    - name: Verify ARPES export and plotting from real SPC files
      run: >-
        python -m pytest -q -rs
        src/ase2sprkkr/result_files/test/test_nexus.py
        src/ase2sprkkr/result_files/test/test_arpes_plot.py

