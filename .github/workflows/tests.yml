name: tests
permissions:
  contents: read

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # in this example, there is a newer version already installed, 3.7.7, so the older version will be downloaded
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - run: |
         mkdir -p ~/.config/matplotlib
         echo "text.usetex : False" >> ~/.config/matplotlib/matplotlibrc
    - run: ./install_dependencies.sh
    - name: Diagnose installed compiled extensions
      run: |
        cd "$RUNNER_TEMP"
        python3 - <<'PY'
        import importlib.metadata
        import os
        import sys
        import ase2sprkkr
        import ase2sprkkr.bindings.xband as xband
        from ase2sprkkr.bindings.xband import spheres, symmetry

        distribution = importlib.metadata.distribution("ase2sprkkr")
        installed_extensions = sorted(
            str(path) for path in distribution.files or ()
            if "bindings/xband" in str(path) and str(path).endswith((".so", ".pyd"))
        )
        print("cwd:", os.getcwd())
        print("ase2sprkkr:", ase2sprkkr.__file__)
        print("ase2sprkkr.__path__:", list(ase2sprkkr.__path__))
        print("xband:", xband.__file__)
        print("xband.__path__:", list(xband.__path__))
        print("spheres:", spheres, getattr(spheres, "__file__", None))
        print("symmetry:", symmetry, getattr(symmetry, "__file__", None))
        print("installed extensions:", installed_extensions)
        print("sys.path:", sys.path)

        assert hasattr(spheres, "empty_spheres")
        assert hasattr(symmetry, "find_symmetry")
        PY
    - name: Test installed wheel
      run: DO_NOT_RUN_SPRKKR=1 "$GITHUB_WORKSPACE/run_tests"
