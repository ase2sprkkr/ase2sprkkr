name: tests
permissions:
  contents: read

on:
  push:
    branches:
      - 'tmp-fix-read-for-task-ci'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-for-task-contract:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: |
         mkdir -p ~/.config/matplotlib
         echo "text.usetex : False" >> ~/.config/matplotlib/matplotlibrc
    - run: ./install_dependencies.sh
    - name: Test read-for-task contract
      run: >-
        DO_NOT_RUN_SPRKKR=1 "$GITHUB_WORKSPACE/run_tests"
        src/ase2sprkkr/input_parameters/test/test_registry_read_contract.py
