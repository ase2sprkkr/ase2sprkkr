name: targeted-read-contract
permissions:
  contents: read

on:
  push:

jobs:
  read-contract:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: |
         mkdir -p ~/.config/matplotlib
         echo "text.usetex : False" >> ~/.config/matplotlib/matplotlibrc
    - run: ./install_dependencies.sh
    - name: Test read/persistence contract
      run: >-
        DO_NOT_RUN_SPRKKR=1 "$GITHUB_WORKSPACE/run_tests"
        -k
        "read_for_task or expected_task or shared_task_default or bsf_task_default or task_name_is_schema_derived or persistent_attach"
