name: tests
permissions:
  contents: read

on:
  push:
    branches-ignore:
      - 'chatgpt-**'
      - 'tmp-**'
  pull_request:
    branches:
      - workflow

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8']
        selection: ['not slow', 'slow']
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - run: |
         mkdir -p ~/.config/matplotlib
         echo "text.usetex : False" >> ~/.config/matplotlib/matplotlibrc
    - run: ./install_dependencies.sh
    - name: Diagnose Python 3.8 test hang
      run: >-
        timeout --signal=TERM 900
        env PYTHONUNBUFFERED=1 DO_NOT_RUN_SPRKKR=1
        "$GITHUB_WORKSPACE/run_tests" -vv -o faulthandler_timeout=120
        -m "${{ matrix.selection }}"
