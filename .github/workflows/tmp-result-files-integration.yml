name: temporary ResultFile integration

on:
  push:
    branches:
      - tmp-result-files-integration

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Integrate rename and finish migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp src/ase2sprkkr/output_files/output_files.py /tmp/current-result-file-parser.py
          cp src/ase2sprkkr/output_files/definition_registry.py /tmp/current-result-file-registry.py
          set +e
          git cherry-pick 7f4669af573a2a7ccef97edfe2f4220374066d43
          cherry_pick_status=$?
          set -e
          if [ "$cherry_pick_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "src/ase2sprkkr/output_files/output_files.py"
            cp /tmp/current-result-file-parser.py src/ase2sprkkr/result_files/result_files.py
            git rm -f src/ase2sprkkr/output_files/output_files.py
            git add src/ase2sprkkr/result_files/result_files.py
            git cherry-pick --continue
          fi
          cp /tmp/current-result-file-registry.py src/ase2sprkkr/result_files/definition_registry.py
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil
          import textwrap

          root = Path("src/ase2sprkkr")
          result_files = root / "result_files"
          compatibility_test = result_files / "test" / "test_output_file_compatibility.py"
          allowed = {
              root / "__init__.py",
              result_files / "output_files.py",
              compatibility_test,
          }

          replacements = (
              ("OutputFileDefinitionRegistry", "ResultFileDefinitionRegistry"),
              ("output_file_definition_registry", "result_file_definition_registry"),
              ("OutputFileSectionDefinition", "ResultFileSectionDefinition"),
              ("OutputFileValueDefinition", "ResultFileValueDefinition"),
              ("OutputFileDefinition", "ResultFileDefinition"),
              ("OutputFileSection", "ResultFileSection"),
              ("CommonOutputFile", "CommonResultFile"),
              ("unknown_output_file_definition", "unknown_result_file_definition"),
              ("create_output_file_definition", "create_result_file_definition"),
              ("output_file_header", "result_file_header"),
              ("output_files_definitions", "result_files_definitions"),
          )

          for path in root.rglob("*.py"):
              if path in allowed or root / "output_files" in path.parents:
                  continue
              text = path.read_text()
              for old, new in replacements:
                  text = text.replace(old, new)
              text = re.sub(
                  r"\b([A-Za-z_][A-Za-z0-9_]*)OutputFile\b",
                  r"\1ResultFile",
                  text,
              )
              text = re.sub(r"\bOutputFile\b", "ResultFile", text)
              text = text.replace("ase2sprkkr.output_files", "ase2sprkkr.result_files")
              text = re.sub(
                  r"(from\s+\.{1,3})output_files(?=[.\s])",
                  r"\1result_files",
                  text,
              )
              text = text.replace(
                  "result_files.output_files import ResultFile",
                  "result_files import ResultFile",
              )
              if result_files in path.parents:
                  text = text.replace("Output files", "Result files")
                  text = text.replace("output files", "result files")
                  text = text.replace("Output file", "Result file")
                  text = text.replace("output file", "result file")
                  text = text.replace("output-file", "result-file")
              path.write_text(text)

          (result_files / "output_files.py").write_text(
              '"""Temporary compatibility shim for the historical ``OutputFile`` name."""\n\n'
              "from .result_files import ResultFile\n\n"
              "# TODO: Remove this compatibility alias in a future release after downstream\n"
              "# users have migrated to ``ResultFile``.\n"
              "OutputFile = ResultFile\n\n"
              '__all__ = ["OutputFile"]\n'
          )

          definitions_shim = result_files / "output_files_definitions.py"
          if definitions_shim.exists():
              definitions_shim.unlink()

          old_package = root / "output_files"
          if old_package.exists():
              shutil.rmtree(old_package)

          test_command = root / "tools" / "commands" / "test.py"
          text = test_command.read_text().replace(
              '        "--ignore",\n        os.path.join(a2s_path, "output_files"),\n',
              "",
          )
          test_command.write_text(text)

          compatibility_test.write_text(textwrap.dedent(r'''
              import importlib
              import re
              from pathlib import Path

              import pytest


              def test_top_level_output_file_alias_warns():
                  import ase2sprkkr

                  with pytest.warns(
                      DeprecationWarning,
                      match=r"ase2sprkkr\.OutputFile is deprecated",
                  ):
                      output_file = ase2sprkkr.OutputFile
                  assert output_file is ase2sprkkr.ResultFile


              def test_internal_output_file_alias_is_result_file():
                  from ase2sprkkr import ResultFile
                  from ase2sprkkr.result_files.output_files import OutputFile

                  assert OutputFile is ResultFile


              def test_old_output_files_package_is_removed():
                  with pytest.raises(ModuleNotFoundError) as error:
                      importlib.import_module("ase2sprkkr.output_files")
                  assert error.value.name == "ase2sprkkr.output_files"


              def test_canonical_result_file_api_does_not_use_legacy_names():
                  package_root = Path(__file__).resolve().parents[2]
                  allowed = {
                      package_root / "__init__.py",
                      package_root / "result_files" / "output_files.py",
                      Path(__file__).resolve(),
                  }
                  failures = []
                  for path in package_root.rglob("*.py"):
                      if path in allowed:
                          continue
                      text = path.read_text()
                      if "output_files_definitions" in text:
                          failures.append((path, "output_files_definitions"))
                      if "ase2sprkkr.output_files" in text:
                          failures.append((path, "ase2sprkkr.output_files"))
                      if re.search(
                          r"from\s+[.\w]*output_files(?:\s+import|\.)", text
                      ):
                          failures.append((path, "legacy output_files import"))
                      if re.search(r"\bOutputFile\b", text):
                          failures.append((path, "OutputFile"))
                  assert not failures, failures
          ''').lstrip())

          usage = Path("doc_src/usage.rst")
          text = usage.read_text()
          marker = "Setting the task type and input parameters\n~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n"
          if "ResultFile.from_file" not in text:
              section = textwrap.dedent('''
                  Structured result files
                  ~~~~~~~~~~~~~~~~~~~~~~~

                  Structured SPR-KKR result files such as DOS, BSF, SPC, RAT, JXC and SFN
                  can be parsed directly through
                  :class:`ResultFile <ase2sprkkr.result_files.ResultFile>`::

                     from ase2sprkkr import ResultFile
                     result = ResultFile.from_file("calculation.dos")

                  The historical top-level ``OutputFile`` name is deprecated.

              ''').lstrip()
              text = text.replace(marker, section + marker)
              usage.write_text(text)

          changelog = Path("doc_src/changelog.rst")
          text = changelog.read_text().replace(
              "``ase2sprkkr`` and ``ase2sprkkr.result_files``. ``OutputFile`` and\n"
              "  ``ase2sprkkr.output_files`` remain as deprecated compatibility aliases.",
              "``ase2sprkkr`` and ``ase2sprkkr.result_files``. The top-level\n"
              "  ``OutputFile`` name remains as a deprecated compatibility alias.",
          )
          changelog.write_text(text)

          for path in root.rglob("*.py"):
              if path in allowed or path == compatibility_test:
                  continue
              source = path.read_text()
              assert "output_files_definitions" not in source, path
              assert "ase2sprkkr.output_files" not in source, path
              assert not re.search(
                  r"from\s+[.\w]*output_files(?:\s+import|\.)", source
              ), path
              assert not re.search(r"\bOutputFile\b", source), path
          PY
          git add -A
          git commit -m 'Finish ResultFile API migration'
      - name: Check patch
        run: |
          git diff HEAD~2..HEAD --check
          python -m compileall -q src/ase2sprkkr
      - name: Install
        run: ./install_dependencies.sh
      - name: Run tests
        env:
          DO_NOT_RUN_SPRKKR: '1'
        run: "$GITHUB_WORKSPACE/run_tests"
      - name: Push tested integration
        run: git push
