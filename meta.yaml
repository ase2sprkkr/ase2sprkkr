{% set pyproject = load_file_data("pyproject.toml") %}
{% set project = pyproject["project"] %}
{% set name = project["name"] %}
{# Conda package versions cannot contain '-', while pyproject uses a PEP 440-compatible spelling such as 3.6.0-beta. #}
{% set version = project["version"] | replace("-", ".") %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  # meta.yaml lives in the repository root; build exactly the checked-out source.
  path: .

build:
  number: 0
  skip: true  # [not linux or py<38]
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('fortran') }}
    - cmake >=3.15
    - ninja
  host:
    - python >=3.8
    - pip
    - scikit-build-core ==0.11.5
    - cython
    - numpy  # [py<310]
    - numpy >=2.1  # [py>=310]
  run:
    - python >=3.8
    - ase >=3.22.0
    - colorama
    - spglib
    - pyparsing >=3.0
    - elementy
    - platformdirs
    - packaging
    - pytest
    - pyyaml
    - ruamel.yaml >=0.18.16
    - requests
    - argcomplete
    - unyt
    - numpy  # [py<310]
    - numpy >=2.1  # [py>=310]
    - networkx <3.3  # [py>=314]

test:
  imports:
    - ase2sprkkr
    - ase2sprkkr.bindings.xband.spheres
    - ase2sprkkr.bindings.xband.symmetry
  commands:
    - ase2sprkkr --help

about:
  home: https://ase2sprkkr.github.io/ase2sprkkr/
  dev_url: https://github.com/ase2sprkkr/ase2sprkkr/
  license: MIT
  license_file: LICENCE
  summary: Wrapper/calculator for SPR-KKR to be used within ASE (Atomic Simulation Environment)
  description: |
    ASE2SPRKKR provides an ASE calculator and Python interface for the SPR-KKR
    electronic-structure package, including input/output handling and compiled
    XBand helper bindings used by the package.
