[build-system]
build-backend = "scikit_build_core.build"
requires = [
    "scikit-build-core==0.11.5",
    "cython",
		"numpy"
]

[project.scripts]
ase2sprkkr = "ase2sprkkr.tools.ase2sprkkr:run"

[project]
name = "ase2sprkkr"
version = "3.6.0-beta1"
requires-python = ">=3.9"
authors = [
  { name = "Matyáš Novák", email = "novakmat@fzu.cz" },
  { name = "Jano Minár" },
  { name = "Ridha Eddhib" },
  { email = "ase2sprkkr@ntc.zcu.cz" }
]
readme = "README.md"
description = "Wrapper/calculator for SPR-KKR to be used within ASE (Atomic Simulation Environment)"
license-files = ["LICENCE"]

dependencies = [
    "ase>=3.22.0",
		"colorama",
    "spglib",
    "pyparsing>=3.0",
    "elementy",
    "platformdirs",
    "packaging",
    # Intentionally a runtime dependency: `ase2sprkkr test` runs the installed
    # package's self-tests so users can verify that their installation works.
    "pytest",
    "pyyaml",
    "ruamel.yaml>=0.18.16",
    "requests",
    "argcomplete",
    "unyt",
    "numpy; python_version < '3.10'",
    "numpy>=2.1; python_version >= '3.10'",
    "networkx<3.3; python_version >= '3.14'",
]

[project.optional-dependencies]
jupyter = [
    "jupyterlab",
    "nbformat",
    "nbconvert",
]
mendeleev = [
    "mendeleev",
]
es_finder = [
    "pymatgen",
]

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.packages = ["src/ase2sprkkr"]
wheel.install-dir = "ase2sprkkr"
sdist.exclude = ["**/*"]
sdist.include = [
    "CMakeLists.txt",
    "LICENCE",
    "README.md",
    "VERSION",
    "pyproject.toml",
    "install_dependencies.sh",
    "run_tests",
    "src/ase2sprkkr/**",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
